name: Build NVIDIA v470 Kernel Module

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "*.md"
      - ".gitignore"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "*.md"
      - ".gitignore"
  workflow_dispatch:

jobs:
  build-and-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies and kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc make kmod curl patch git \
            "linux-headers-$(uname -r)"

      - name: Download and extract NVIDIA v470 driver
        run: |
          DRIVERVERSION="470.256.02"
          DRIVERNAME="NVIDIA-Linux-x86_64-${DRIVERVERSION}"
          DRIVERFILE="${DRIVERNAME}.run"

          echo "Downloading NVIDIA driver ${DRIVERVERSION}..."
          curl -f -sSL \
            "https://us.download.nvidia.com/XFree86/Linux-x86_64/${DRIVERVERSION}/${DRIVERFILE}" \
            -o "${DRIVERFILE}"

          echo "Extracting driver package..."
          sh "${DRIVERFILE}" --extract-only
          rm "${DRIVERFILE}"

          cd "${DRIVERNAME}"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Initial extracted source"

      - name: Apply custom repository patches
        run: |
          DRIVERVERSION="470.256.02"
          DRIVERNAME="NVIDIA-Linux-x86_64-${DRIVERVERSION}"

          if [ -d "patches" ]; then
            shopt -s nullglob
            for p in patches/*.patch; do
              echo "Applying repository patch: ${p}"
              (
                cd "${DRIVERNAME}"
                patch --batch --forward -p1 < "../${p}"
              )
            done
          fi

      - name: Prepare Kbuild include paths
        run: |
          DRIVERVERSION="470.256.02"
          DRIVERNAME="NVIDIA-Linux-x86_64-${DRIVERVERSION}"
          cd "${DRIVERNAME}"

          GCC_INCLUDE_DIR="$(gcc -print-file-name=include)"
          if [ ! -f "${GCC_INCLUDE_DIR}/stdarg.h" ] ||
             [ ! -f "${GCC_INCLUDE_DIR}/stddef.h" ]; then
            echo "GCC builtin headers not found in ${GCC_INCLUDE_DIR}" >&2
            exit 1
          fi
          echo "Using GCC builtin headers from ${GCC_INCLUDE_DIR}"

          # Find both Kbuild filenames. Parentheses keep the name alternatives
          # grouped so -type f applies to both.
          find kernel/ -type f \
            \( -name "Kbuild" -o -name "Kbuild.nvidia" \) -print0 |
            while IFS= read -r -d '' kfile; do
              if ! grep -Fq "ccflags-y += -isystem ${GCC_INCLUDE_DIR}" "$kfile"; then
                sed -i "1i ccflags-y += -isystem ${GCC_INCLUDE_DIR}" "$kfile"
              fi

              if ! grep -Fq 'ccflags-y += -I$(src)' "$kfile"; then
                sed -i '1i ccflags-y += -I$(src) -I$(src)/nvidia -I$(src)/nvidia-modeset -I$(src)/../common/inc -I$(src)/common/inc' "$kfile"
              fi
            done

      - name: Compile kernel module
        run: |
          DRIVERVERSION="470.256.02"
          DRIVERNAME="NVIDIA-Linux-x86_64-${DRIVERVERSION}"
          cd "${DRIVERNAME}/kernel"

          echo "Building against kernel $(uname -r)"
          echo "Compiler: $(gcc --version | head -n 1)"

          if BUILD_LOG=$(make -j"$(nproc)" modules "KERNEL_UNAME=$(uname -r)" 2>&1); then
            echo "$BUILD_LOG"
            echo "Build succeeded."
          else
            BUILD_EXIT=$?
            echo "Kernel module build failed (exit ${BUILD_EXIT}). Full build log:" >&2
            echo "$BUILD_LOG" >&2

            if echo "$BUILD_LOG" |
              grep -Eq 'fatal error: (stdarg\.h|stddef\.h): No such file or directory'; then
              echo "The compiler builtin include path is still missing from the effective Kbuild flags." >&2
            fi

            if echo "$BUILD_LOG" |
              grep -Eq 'acpi_walk_namespace.*conftest failed'; then
              echo "The ACPI conftest failed. Inspect its generated test and the target kernel API before applying a compatibility patch." >&2
            fi

            if echo "$BUILD_LOG" |
              grep -Eq "has no member named 'date'|drm_pci_init"; then
              echo "The driver has a DRM API compatibility error. Use a targeted compatibility patch; do not delete the failing API reference blindly." >&2
            fi

            exit "$BUILD_EXIT"
          fi

      - name: Generate unified patch file
        if: always()
        run: |
          DRIVERVERSION="470.256.02"
          DRIVERNAME="NVIDIA-Linux-x86_64-${DRIVERVERSION}"

          if [ ! -d "${DRIVERNAME}/.git" ]; then
            echo "Driver source or Git baseline is unavailable; skipping patch generation."
            exit 0
          fi

          cd "${DRIVERNAME}"
          if git status --porcelain | grep -q .; then
            echo "Changes detected; generating nvidia-v470-kernel.patch..."
            git diff > ../nvidia-v470-kernel.patch
          else
            echo "No changes made; generating empty patch."
            touch ../nvidia-v470-kernel.patch
          fi

      - name: Upload generated patch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-v470-auto-patch
          path: nvidia-v470-kernel.patch
          if-no-files-found: ignore
